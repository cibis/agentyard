networks:
  agent-net:
    driver: bridge

volumes:
  openclaw-workspace:
  opencode-workspace:
  agent-exchange:

services:

  openclaw:
    image: openclaw:local
    build:
      context: ../openclaw
      args:
        OPENCLAW_INSTALL_BROWSER: "1"
        OPENCLAW_DOCKER_APT_PACKAGES: "wget vim nano less jq python3-pip build-essential htop net-tools iputils-ping bind9-dnsutils unzip zip"
    container_name: openclaw
    restart: unless-stopped
    networks:
      - agent-net
    ports:
      - "18789:18789"
      - "9080:9080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      - BRAVE_API_KEY=${BRAVE_API_KEY}
      - OPENCLAW_CONFIG_PATH=/config/openclaw.json
      - OPENCLAW_ALLOW_ROOT=1
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - AWS_REGION_NAME=${AWS_REGION_NAME}
      - PAPERCLIP_API_KEY=${PAPERCLIP_API_KEY}
      - PAPERCLIP_API_URL=${PAPERCLIP_API_URL}
      - PLAYWRIGHT_BROWSERS_PATH=/home/node/.cache/ms-playwright
      - OPENCLAW_EXTRA_MEDIA_ROOTS=/exchange/outbox/openclaw/screenshots
    user: root
    cap_add:
      - ALL
    cap_drop:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
      - no-new-privileges:false
    ipc: private
    pids_limit: -1
    shm_size: "2gb"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
      nproc: -1
      memlock: -1
      core: -1
    volumes:
      - ./config/openclaw.json:/config/openclaw.json:ro
      - ./skills:/app/skills/agentyard:ro
      - openclaw-workspace:/root/.openclaw/workspace
      - ./config/openclaw-workspace/AGENTS.md:/root/.openclaw/workspace/AGENTS.md:ro
      - ./shared:/exchange
      - agent-exchange:/agent-exchange
    command: ["node", "openclaw.mjs", "gateway", "--bind", "lan", "--port", "18789"]
    healthcheck:
      test: ["CMD", "node", "-e",
        "fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  opencode:
    image: opencode:local
    build:
      context: ../opencode
    container_name: opencode
    restart: unless-stopped
    networks:
      - agent-net
    ports:
      - "9081:9081"
      - "2223:22"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      - BRAVE_API_KEY=${BRAVE_API_KEY}
      - OPENCODE_SSH_PASS=${OPENCODE_SSH_PASS}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - AWS_REGION_NAME=${AWS_REGION_NAME}
    user: root
    cap_add:
      - ALL
    cap_drop:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
      - no-new-privileges:false
    ipc: private
    pids_limit: -1
    shm_size: "2gb"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
      nproc: -1
      memlock: -1
      core: -1
    volumes:
      - ./config/opencode.jsonc:/root/.config/opencode/opencode.jsonc:ro
      - ./skills/opencode/AGENTS.md:/root/.config/opencode/AGENTS.md:ro
      - ./skills/opencode/SKILL.md:/workspace/serve-conventions.md:ro
      - ./skills/conventions/SKILL.md:/workspace/conventions.md:ro
      - ./skills/file-exchange/SKILL.md:/workspace/file-exchange-conventions.md:ro
      - opencode-workspace:/workspace
      - ./shared:/exchange
      - agent-exchange:/agent-exchange
    command:
      - /bin/bash
      - -c
      - |
        echo "root:${OPENCODE_SSH_PASS:-opencode}" | chpasswd
        printf 'export ANTHROPIC_API_KEY="%s"\nexport AWS_ACCESS_KEY_ID="%s"\nexport AWS_SECRET_ACCESS_KEY="%s"\nexport AWS_REGION="%s"\nexport AWS_DEFAULT_REGION="%s"\n' \
          "$$ANTHROPIC_API_KEY" "$$AWS_ACCESS_KEY_ID" "$$AWS_SECRET_ACCESS_KEY" "$$AWS_REGION" "$$AWS_DEFAULT_REGION" \
          >> /root/.bashrc
        if [ -f /exchange/outbox/opencode/serve/server.js ]; then
          node /exchange/outbox/opencode/serve/server.js &
          SERVER_PID=$$!
          if [ -f /exchange/outbox/opencode/serve-process.json ]; then
            node -e "
              const fs=require('fs');
              const d=JSON.parse(fs.readFileSync('/exchange/outbox/opencode/serve-process.json'));
              d.server.pid=$$SERVER_PID;
              d.server.started_at=new Date().toISOString();
              fs.writeFileSync('/exchange/outbox/opencode/serve-process.json',JSON.stringify(d,null,2));
            "
          fi
        fi
        exec /usr/sbin/sshd -D
    healthcheck:
      test: ["CMD", "pgrep", "-x", "sshd"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
